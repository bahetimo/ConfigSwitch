plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.26.1'

    testImplementation files(sourceSets.main.compileClasspath.files)
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.register('verifyNoLoaderImports') {
    group = 'verification'
    description = 'common cannot contain any loader API'
    doLast {
        def offenders = []
        fileTree('src/main/java').matching { include '**/*.java' }.each { f ->
            f.eachLine { line, n ->
                if (line ==~ /\s*import\s+(net\.fabricmc|net\.minecraftforge|net\.neoforged)\..*/) {
                    offenders << "${f.path}:${n}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('common found loader imports:\n' + offenders.join('\n'))
        }
    }
}

check.dependsOn verifyNoLoaderImports

