name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

# 最小权限：这个 workflow 只需要读代码
permissions:
  contents: read

jobs:
  build:
    # 用 Windows runner：本项目 v1 只支持 Windows，且部分测试依赖 Windows 专有行为
    # （ACL 可写判定、非法路径字符、异常类型），在 Linux 上会失败。
    # 这样 CI 的环境与目标平台一致，所有测试都真跑，而不是被跳过。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: configswitch-jar
          path: build/libs/*.jar
          if-no-files-found: error
