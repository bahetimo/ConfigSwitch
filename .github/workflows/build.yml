name: Build

on:
  # 任何分支的 push 都跑——单人开发时，实验分支也要在合并前验证。
  # branches: ['**'] 是「所有分支」但不含 tag：建 Release 时产生的 tag push 不该再跑一次构建
  push:
    branches: [ '**' ]
  # 不过滤目标分支：写死分支名意味着每加一个版本分支都要改 CI
  pull_request:
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

# 最小权限：这个 workflow 只需要读代码
permissions:
  contents: read

jobs:
  build:
    # 用 Windows runner：本项目 v1 只支持 Windows，且部分测试依赖 Windows 专有行为
    # （ACL 可写判定、非法路径字符、异常类型），在 Linux 上会失败。
    # 这样 CI 的环境与目标平台一致，所有测试都真跑，而不是被跳过。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 浅克隆里没有 tag，git describe --always 会退化成 commit 短哈希，
          # 仓库只有 5.7 MB，全量克隆的代价可以忽略。
          fetch-depth: 0

      # Java 版本的真源是 gradle.properties。
      # 从文件读而不是写死，是为了让两个分支的 workflow 逐字节相同。
      - name: Resolve Java version
        id: props
        shell: bash
        run: |
          J=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '\r')
          if [ -z "$J" ]; then
            echo "::error::gradle.properties 缺少 java_version"
            exit 1
          fi
          echo "java=$J" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check i18n keys
        run: python tools/check_i18n.py

      - name: Build and test
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: configswitch-jar
          # 多模块：产物在各自的 build/libs。不要用 */build/libs（会把 buildSrc.jar 带进来）。
          # common 是库 jar，留在这里方便排查；发布包（release.yml）只要三份加载器 jar。
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
