name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

# 最小权限：这个 workflow 只需要读代码
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: configswitch-jar
          path: build/libs/*.jar
          if-no-files-found: error
