name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Please fill in as much as you can — the log section especially.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press H in-game
        2. Tick "sodium"
        3. Click Push
        4. ...
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: ConfigSwitch version
      placeholder: "1.0.0-alpha+1.21.1"
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft and Fabric Loader version
      placeholder: "Minecraft 1.21.1, Fabric Loader 0.16.10"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: logs/latest.log
      description: |
        Drag your `logs/latest.log` in here — or just the lines containing
        `[ConfigSwitch]`. That prefix is how our entries can be told apart
        from the other mods' (latest.log has no per-mod names in it).
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### If the normal log isn't enough

        For problems where **nothing seems to happen** (a config didn't change,
        a button did nothing, a sync had no effect), `latest.log` usually can't
        show what went wrong. In that case you can have ConfigSwitch write its
        own detailed log:

        1. In your launcher's **advanced / JVM options** for this instance, add:
           `-Dconfigswitch.debug=true`
        2. Start the game and reproduce the problem **once**
        3. Quit the game
        4. Attach **`logs/configswitch-debug.log`** — it contains *only*
           ConfigSwitch's own log, including detailed step-by-step entries
        5. Remove the argument again (it's a one-off; it does not persist)

        You don't need to do this for every report — only when the plain log
        doesn't show what happened.
