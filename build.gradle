plugins {
    id 'fabric-loom' version '1.12.1' apply false

    id 'net.neoforged.moddev' version '2.0.141' apply false

    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}

def computeVersion(){
    if (project.hasProperty("currentTag")) {
        return project.currentTag.replaceFirst("^v", "")
    }
    try {
        def desc = project.providers.exec {
            commandLine "git", "describe", "--tags", "--always", "--dirty"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return desc.isEmpty() ? "0.0.0-dev" : desc.replaceFirst("^v", "")
    } catch (Exception ignored) {
        return "0.0.0-dev"
    }
}

def projectVersion = computeVersion()

allprojects {
    version = projectVersion
}
